rust-checks:
  stage: test
  image: ubuntu:22.04
  variables:
    CARGO_HOME: $CI_PROJECT_DIR/.cargo
    DEBIAN_FRONTEND: noninteractive
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl pkg-config build-essential
      libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path
    - source "$CARGO_HOME/env"
  script:
    - source "$CARGO_HOME/env"
    - cargo test --manifest-path src-tauri/Cargo.toml
    - cargo check --manifest-path src-tauri/Cargo.toml --release
  cache:
    key: rust-$CI_COMMIT_REF_SLUG
    paths:
      - .cargo/registry/
      - .cargo/git/
      - src-tauri/target/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'

frontend-check:
  stage: test
  image: oven/bun:latest
  before_script:
    - bun install --frozen-lockfile
  script:
    - bunx tsc --noEmit
  cache:
    key: node-$CI_COMMIT_REF_SLUG
    paths:
      - node_modules/
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/'
