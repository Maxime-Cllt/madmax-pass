<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Madmax Pass | Ultra Secure</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body class="min-h-screen bg-slate-950 text-slate-100 antialiased flex items-center justify-center p-4">
  <div class="w-full max-w-xl">
    <!-- Header -->
    <div class="text-center mb-10">
      <div class="inline-flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/20 mb-4">
        <span class="text-2xl font-bold text-white">MP</span>
      </div>
      <h1 class="text-3xl font-bold tracking-tight text-white">Madmax Pass</h1>
      <p class="mt-2 text-slate-400">Générateur de mots de passe à haute entropie</p>
    </div>

    <!-- Main Card -->
    <main class="relative group">
      <!-- Background Glow -->
      <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-3xl blur opacity-20 group-hover:opacity-30 transition duration-1000"></div>

      <section class="relative bg-slate-900/80 backdrop-blur-xl border border-white/10 rounded-3xl p-8 shadow-2xl">
        <form id="password-form" class="space-y-8">
          <!-- Output Area -->
          <div class="space-y-3">
            <label class="block text-xs font-semibold uppercase tracking-widest text-slate-500 ml-1">Mot de passe
              généré</label>
            <div class="relative flex items-center">
              <input
                      id="password-output"
                      type="text"
                      readonly
                      class="w-full bg-slate-950/50 border border-white/5 rounded-2xl px-5 py-4 text-xl font-mono text-cyan-400 placeholder:text-slate-800 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all"
                      placeholder="••••••••••••••••"
              />
              <button
                      id="copy-btn"
                      type="button"
                      title="Copier le mot de passe"
                      class="absolute right-3 p-2 rounded-xl bg-white/5 hover:bg-white/10 text-slate-300 hover:text-white transition-all active:scale-95"
              >
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                  <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Settings -->
          <div class="space-y-6">
            <div class="flex items-center justify-between">
              <label for="length-input" class="text-xs font-semibold uppercase tracking-widest text-slate-500 ml-1">Longueur
                : <span id="length-display" class="text-cyan-400 font-mono text-sm ml-2">32</span></label>
              <span class="text-[10px] text-slate-600 uppercase tracking-tighter">Sécurité maximale</span>
            </div>

            <div class="px-1">
              <input
                      id="length-input"
                      type="range"
                      min="16"
                      max="128"
                      value="32"
                      class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-500 hover:accent-cyan-400 transition-all"
              />
            </div>

            <div class="flex justify-between text-[10px] text-slate-600 font-mono px-1">
              <span>16</span>
              <span>64</span>
              <span>128</span>
            </div>
          </div>

          <!-- Action -->
          <div class="pt-4">
            <button
                    id="generate-btn"
                    type="submit"
                    class="w-full group relative flex items-center justify-center gap-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-cyan-900/20 transition-all active:scale-[0.98] overflow-hidden"
            >
                <span class="relative z-10 flex items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                       class="group-hover:rotate-180 transition-transform duration-500"><path
                          d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                  GÉNÉRER
                </span>
              <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
            </button>
          </div>

          <!-- Status -->
          <p id="status-msg" class="text-center text-xs font-medium min-h-[1rem]"></p>
        </form>
      </section>
    </main>

    <!-- Footer Info -->
    <footer class="mt-8 text-center space-y-4">
      <div class="flex items-center justify-center gap-4 text-[10px] uppercase tracking-[0.2em] text-slate-600">
        <span class="flex items-center gap-1.5"><span
                class="h-1 w-1 rounded-full bg-emerald-500"></span> Rust Engine</span>
        <span class="flex items-center gap-1.5"><span
                class="h-1 w-1 rounded-full bg-emerald-500"></span> Zero Sync</span>
        <span class="flex items-center gap-1.5"><span
                class="h-1 w-1 rounded-full bg-emerald-500"></span> Local AES</span>
      </div>
    </footer>
  </div>
  </body>
</html>
