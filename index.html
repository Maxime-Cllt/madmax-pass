<!doctype html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8"/>
    <link rel="stylesheet" href="/src/styles.css"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Madmax Pass | Ultra Secure</title>
    <script type="module" src="/src/main.ts" defer></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased flex transition-colors duration-300 overflow-hidden">
<!-- Sidebar -->
<aside id="sidebar"
       class="w-64 border-r border-slate-200 dark:border-white/5 bg-white dark:bg-slate-900/40 backdrop-blur-xl flex flex-col p-4 shrink-0 transition-all duration-300 relative group/sidebar shadow-xl dark:shadow-none">

    <!-- Collapse Toggle -->
    <button id="sidebar-toggle"
            class="absolute -right-3 top-8 h-6 w-6 rounded-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-white/10 shadow-sm flex items-center justify-center text-slate-400 hover:text-cyan-500 transition-all z-50">
        <svg id="toggle-icon" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
             class="transition-transform duration-300">
            <path d="m15 18-6-6 6-6"/>
        </svg>
    </button>

    <!-- Logo & Theme Toggle -->
    <div class="flex items-center justify-between mb-10 px-2">
        <div class="flex items-center gap-3 overflow-hidden whitespace-nowrap">
            <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-cyan-500 to-blue-600 shadow-lg shadow-cyan-500/20 text-white font-bold">
                MP
            </div>
            <div class="sidebar-text transition-opacity duration-300">
                <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400 dark:text-slate-500 leading-none mb-1 font-bold">
                    Madmax</p>
                <p class="text-sm font-bold leading-none">Pass</p>
            </div>
        </div>
        <button id="theme-toggle"
                class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-white/5 text-slate-400 dark:text-slate-500 hover:text-cyan-500 transition-colors shrink-0">
            <svg id="sun-icon" class="hidden dark:block" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"/>
                <path d="M12 2v2"/>
                <path d="M12 20v2"/>
                <path d="m4.93 4.93 1.41 1.41"/>
                <path d="m17.66 17.66 1.41 1.41"/>
                <path d="M2 12h2"/>
                <path d="M20 12h2"/>
                <path d="m6.34 17.66-1.41 1.41"/>
                <path d="m19.07 4.93-1.41 1.41"/>
            </svg>
            <svg id="moon-icon" class="dark:hidden" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                 viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round">
                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
            </svg>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="space-y-2 flex-1 overflow-hidden">
        <!-- Passwords nav (active by default) -->
        <a id="nav-passwords" href="#"
           class="flex items-center gap-3 px-3 py-3 rounded-xl bg-cyan-500/5 dark:bg-cyan-500/10 border border-cyan-500/20 text-cyan-600 dark:text-cyan-400 font-bold transition-all group overflow-hidden whitespace-nowrap">
            <div class="shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="group-hover:rotate-12 transition-transform">
                    <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3-3.5 3.5z"/>
                </svg>
            </div>
            <span class="sidebar-text transition-opacity duration-300 font-bold">Générateur</span>
        </a>

        <!-- Tokens nav (inactive by default) -->
        <a id="nav-tokens" href="#"
           class="flex items-center gap-3 px-3 py-3 rounded-xl border border-transparent text-slate-500 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-white/5 hover:text-slate-700 dark:hover:text-slate-200 transition-all group overflow-hidden whitespace-nowrap">
            <div class="shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     class="group-hover:scale-110 transition-transform">
                    <path d="M4 7V4h16v3"/>
                    <path d="M9 20h6"/>
                    <path d="M12 4v16"/>
                </svg>
            </div>
            <span class="sidebar-text transition-opacity duration-300 font-bold">Tokens</span>
        </a>
    </nav>
</aside>

<!-- Main Content -->
<main class="flex-1 flex flex-col items-center overflow-y-auto bg-slate-100/30 dark:bg-slate-950/20 transition-colors duration-300">

    <!-- ── PASSWORD VIEW ── -->
    <div id="view-password" class="w-full max-w-2xl px-4 py-8 my-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Sécurité
                Maximale</h1>
            <p class="mt-1 text-slate-500 dark:text-slate-400 text-xs md:text-sm font-medium">Génération de clés
                cryptographiques à haute entropie</p>
        </div>

        <div class="relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500 to-blue-600 rounded-3xl blur opacity-20 dark:opacity-20 group-hover:opacity-30 transition duration-1000"></div>
            <section
                    class="relative bg-white dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200 dark:border-white/10 rounded-3xl p-5 md:p-8 shadow-2xl transition-colors duration-300">
                <form id="password-form" class="space-y-6">
                    <!-- Top Action Area (Always visible if possible) -->
                    <div class="space-y-3">
                        <label class="block text-[10px] font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500 ml-1">Mot
                            de passe généré</label>
                        <div class="flex gap-3">
                            <div class="relative flex-1 min-w-0">
                                <input id="password-output" type="text" readonly
                                       class="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-white/5 rounded-2xl px-4 py-3 md:py-4 text-lg md:text-xl font-mono text-cyan-600 dark:text-cyan-400 placeholder:text-slate-300 dark:placeholder:text-slate-800 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all"
                                       placeholder="••••••••••••••••"/>
                            </div>
                            <button id="copy-btn" type="button" title="Copier le mot de passe"
                                    class="shrink-0 w-[50px] md:w-[60px] flex items-center justify-center rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:bg-slate-100 dark:hover:bg-white/10 hover:border-cyan-500/30 text-slate-400 dark:text-slate-300 hover:text-cyan-600 dark:hover:text-white transition-all active:scale-95 group/copy">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                     stroke-linejoin="round" class="group-hover/copy:scale-110 transition-transform">
                                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                                </svg>
                            </button>
                        </div>

                        <!-- Main Generate Button - Moved up for better visibility -->
                        <div class="pt-1">
                            <button id="generate-btn" type="submit"
                                    class="w-full group relative flex items-center justify-center gap-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 md:py-4 px-6 rounded-2xl shadow-lg shadow-cyan-900/20 transition-all active:scale-[0.98] overflow-hidden">
                                <span class="relative z-10 flex items-center gap-2 text-sm md:text-base">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                         stroke-linejoin="round"
                                         class="group-hover:rotate-180 transition-transform duration-500">
                                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path
                                            d="M21 3v5h-5"/>
                                    </svg>
                                    GÉNÉRER
                                </span>
                                <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                            </button>
                        </div>
                    </div>

                    <!-- Options Area -->
                    <div class="space-y-6 pt-2 border-t border-slate-100 dark:border-white/5">
                        <div class="space-y-4">
                            <div class="flex items-center justify-between">
                                <label for="length-input"
                                       class="text-[10px] font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500 ml-1">
                                    Longueur : <span id="length-display"
                                                     class="text-cyan-600 dark:text-cyan-400 font-mono text-sm ml-2">32</span>
                                </label>
                            </div>
                            <div class="px-1">
                                <input id="length-input" type="range" min="4" max="128" value="32"
                                       class="w-full h-1.5 bg-slate-200 dark:bg-slate-800 rounded-lg appearance-none cursor-pointer accent-cyan-500 hover:accent-cyan-400 transition-all"/>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-3 md:gap-4">
                            <label class="flex items-center justify-between p-3 md:p-4 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 hover:border-cyan-500/20 transition-all cursor-pointer group">
                                <span class="text-[10px] md:text-xs font-bold text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">Majuscules</span>
                                <input type="checkbox" id="include-upper" checked
                                       class="h-4 w-4 md:h-5 md:w-5 rounded-lg border-slate-300 dark:border-white/10 bg-white dark:bg-slate-900 text-cyan-500 focus:ring-cyan-500/50"/>
                            </label>
                            <label class="flex items-center justify-between p-3 md:p-4 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 hover:border-cyan-500/20 transition-all cursor-pointer group">
                                <span class="text-[10px] md:text-xs font-bold text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">Minuscules</span>
                                <input type="checkbox" id="include-lower" checked
                                       class="h-4 w-4 md:h-5 md:w-5 rounded-lg border-slate-300 dark:border-white/10 bg-white dark:bg-slate-900 text-cyan-500 focus:ring-cyan-500/50"/>
                            </label>
                            <label class="flex items-center justify-between p-3 md:p-4 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 hover:border-cyan-500/20 transition-all cursor-pointer group">
                                <span class="text-[10px] md:text-xs font-bold text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">Chiffres</span>
                                <input type="checkbox" id="include-digits" checked
                                       class="h-4 w-4 md:h-5 md:w-5 rounded-lg border-slate-300 dark:border-white/10 bg-white dark:bg-slate-900 text-cyan-500 focus:ring-cyan-500/50"/>
                            </label>
                            <label class="flex items-center justify-between p-3 md:p-4 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 hover:border-cyan-500/20 transition-all cursor-pointer group">
                                <span class="text-[10px] md:text-xs font-bold text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">Symboles</span>
                                <input type="checkbox" id="include-symbols" checked
                                       class="h-4 w-4 md:h-5 md:w-5 rounded-lg border-slate-300 dark:border-white/10 bg-white dark:bg-slate-900 text-cyan-500 focus:ring-cyan-500/50"/>
                            </label>
                        </div>

                        <!-- Mode Quantum Safe -->
                        <label id="quantum-safe-label"
                               class="flex items-center justify-between p-3 md:p-4 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 hover:border-cyan-500/20 transition-all cursor-pointer group">
                            <div class="flex items-start gap-3">
                                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                     stroke-linejoin="round"
                                     class="text-slate-400 dark:text-slate-500 group-hover:text-cyan-500 transition-colors shrink-0 mt-0.5">
                                    <circle cx="12" cy="12" r="3"/>
                                    <path d="M12 2v2m0 16v2M2 12h2m16 0h2m-3.5-6.5-1.5 1.5M7 17l-1.5 1.5m0-11L7 7m10 10-1.5-1.5"/>
                                </svg>
                                <div>
                                    <span class="text-[10px] md:text-xs font-bold text-slate-500 dark:text-slate-400 group-hover:text-slate-700 dark:group-hover:text-slate-200">Mode Quantum Safe</span>
                                    <p class="text-[9px] text-slate-400 dark:text-slate-500 mt-0.5">≥ 128 bits
                                        quantiques · min 40 car.</p>
                                </div>
                            </div>
                            <input type="checkbox" id="quantum-safe"
                                   class="h-4 w-4 md:h-5 md:w-5 rounded-lg border-slate-300 dark:border-white/10 bg-white dark:bg-slate-900 text-cyan-500 focus:ring-cyan-500/50"/>
                        </label>
                    </div>

                    <!-- Estimations multi-scénarios (Rust) -->
                    <div class="space-y-1.5 pt-2 border-t border-slate-100 dark:border-white/5">
                        <p class="text-[9px] uppercase tracking-widest text-slate-400 dark:text-slate-500 font-semibold px-1">
                            Temps pour craquer</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <div class="flex items-center justify-between md:flex-col md:items-start p-2 rounded-xl bg-slate-50/50 dark:bg-white/5">
                                <span class="text-[9px] text-slate-400 dark:text-slate-500">Hash rapide</span>
                                <span id="crack-fast"
                                      class="text-[10px] font-mono font-bold text-slate-300 dark:text-slate-700 transition-colors duration-300">—</span>
                            </div>
                            <div class="flex items-center justify-between md:flex-col md:items-start p-2 rounded-xl bg-slate-50/50 dark:bg-white/5">
                                <span class="text-[9px] text-slate-400 dark:text-slate-500">Hash lent</span>
                                <span id="crack-slow"
                                      class="text-[10px] font-mono font-bold text-slate-300 dark:text-slate-700 transition-colors duration-300">—</span>
                            </div>
                            <div class="flex items-center justify-between md:flex-col md:items-start p-2 rounded-xl bg-slate-50/50 dark:bg-white/5">
                                <span class="text-[9px] text-slate-400 dark:text-slate-500">Quantique</span>
                                <span id="crack-quantum"
                                      class="text-[10px] font-mono font-bold text-slate-300 dark:text-slate-700 transition-colors duration-300">—</span>
                            </div>
                        </div>
                    </div>

                    <p id="status-msg" class="text-center text-[10px] font-bold min-h-[1rem]"></p>
                </form>
            </section>
        </div>
    </div>

    <!-- ── TOKEN VIEW ── -->
    <div id="view-token" class="hidden w-full max-w-2xl px-4 py-8 my-auto">
        <div class="text-center mb-6">
            <h1 class="text-2xl md:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Token
                Cryptographique</h1>
            <p class="mt-1 text-slate-500 dark:text-slate-400 text-xs md:text-sm font-medium">Génération de tokens via
                entropie OS</p>
        </div>

        <div class="relative group">
            <div class="absolute -inset-0.5 bg-gradient-to-r from-violet-500 to-cyan-500 rounded-3xl blur opacity-20 dark:opacity-20 group-hover:opacity-30 transition duration-1000"></div>
            <section
                    class="relative bg-white dark:bg-slate-900/80 backdrop-blur-xl border border-slate-200 dark:border-white/10 rounded-3xl p-5 md:p-8 shadow-2xl transition-colors duration-300">
                <div class="space-y-6">
                    <!-- Token output & Generate -->
                    <div class="space-y-3">
                        <label class="block text-[10px] font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500 ml-1">Token
                            généré</label>
                        <div class="flex gap-3">
                            <div class="relative flex-1 min-w-0">
                                <input id="token-output" type="text" readonly
                                       class="w-full bg-slate-50 dark:bg-slate-950/50 border border-slate-200 dark:border-white/5 rounded-2xl px-4 py-3 md:py-4 text-sm md:text-base font-mono text-violet-600 dark:text-violet-400 placeholder:text-slate-300 dark:placeholder:text-slate-800 focus:outline-none focus:ring-2 focus:ring-violet-500/50 transition-all"
                                       placeholder="••••••••••••••••••••••••••••••••"/>
                            </div>
                            <button id="token-copy-btn" type="button" title="Copier le token"
                                    class="shrink-0 w-[50px] md:w-[60px] flex items-center justify-center rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/10 hover:bg-slate-100 dark:hover:bg-white/10 hover:border-violet-500/30 text-slate-400 dark:text-slate-300 hover:text-violet-600 dark:hover:text-white transition-all active:scale-95 group/copy">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                     stroke-linejoin="round" class="group-hover/copy:scale-110 transition-transform">
                                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
                                </svg>
                            </button>
                        </div>

                        <!-- Generate button moved up -->
                        <div class="pt-1">
                            <button id="token-generate-btn" type="button"
                                    class="w-full group relative flex items-center justify-center gap-3 bg-gradient-to-r from-violet-500 to-cyan-500 hover:from-violet-400 hover:to-cyan-400 text-white font-bold py-3 md:py-4 px-6 rounded-2xl shadow-lg shadow-violet-900/20 transition-all active:scale-[0.98] overflow-hidden">
                                <span class="relative z-10 flex items-center gap-2 text-sm md:text-base">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                                         fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                                         stroke-linejoin="round"
                                         class="group-hover:rotate-180 transition-transform duration-500">
                                        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path
                                            d="M21 3v5h-5"/>
                                    </svg>
                                    GÉNÉRER
                                </span>
                                <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform duration-300"></div>
                            </button>
                        </div>
                    </div>

                    <!-- Options Area -->
                    <div class="space-y-6 pt-2 border-t border-slate-100 dark:border-white/5">
                        <div class="space-y-3">
                            <label class="block text-[10px] font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500 ml-1">Taille
                                (octets)</label>
                            <div class="grid grid-cols-4 gap-2">
                                <button data-bytes="16"
                                        class="token-size-btn flex flex-col items-center py-2 md:py-3 rounded-2xl bg-violet-500/10 dark:bg-violet-500/10 border border-violet-500/30 text-violet-600 dark:text-violet-400 font-bold transition-all text-[10px] md:text-sm">
                                    16 <span
                                        class="text-[8px] md:text-[10px] font-normal opacity-70 mt-0.5">128 bits</span>
                                </button>
                                <button data-bytes="32"
                                        class="token-size-btn flex flex-col items-center py-2 md:py-3 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 text-slate-500 dark:text-slate-400 hover:border-violet-500/20 font-bold transition-all text-[10px] md:text-sm">
                                    32 <span
                                        class="text-[8px] md:text-[10px] font-bold text-emerald-500 mt-0.5">QS ✓</span>
                                </button>
                                <button data-bytes="48"
                                        class="token-size-btn flex flex-col items-center py-2 md:py-3 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 text-slate-500 dark:text-slate-400 hover:border-violet-500/20 font-bold transition-all text-[10px] md:text-sm">
                                    48 <span
                                        class="text-[8px] md:text-[10px] font-bold text-emerald-500 mt-0.5">QS ✓</span>
                                </button>
                                <button data-bytes="64"
                                        class="token-size-btn flex flex-col items-center py-2 md:py-3 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 text-slate-500 dark:text-slate-400 hover:border-violet-500/20 font-bold transition-all text-[10px] md:text-sm">
                                    64 <span
                                        class="text-[8px] md:text-[10px] font-bold text-emerald-500 mt-0.5">QS ✓</span>
                                </button>
                            </div>
                        </div>

                        <div class="space-y-3">
                            <label class="block text-[10px] font-semibold uppercase tracking-widest text-slate-400 dark:text-slate-500 ml-1">Format</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button data-format="hex"
                                        class="token-format-btn py-2 md:py-3 rounded-2xl bg-violet-500/10 dark:bg-violet-500/10 border border-violet-500/30 text-violet-600 dark:text-violet-400 font-bold transition-all text-[10px] md:text-xs">
                                    Hex
                                </button>
                                <button data-format="base64url"
                                        class="token-format-btn py-2 md:py-3 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 text-slate-500 dark:text-slate-400 hover:border-violet-500/20 font-bold transition-all text-[10px] md:text-xs">
                                    Base64url
                                </button>
                                <button data-format="alphanumeric"
                                        class="token-format-btn py-2 md:py-3 rounded-2xl bg-slate-50 dark:bg-white/5 border border-slate-200 dark:border-white/5 text-slate-500 dark:text-slate-400 hover:border-violet-500/20 font-bold transition-all text-[10px] md:text-xs">
                                    Alphanum
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Estimations -->
                    <div class="space-y-1.5 pt-2 border-t border-slate-100 dark:border-white/5">
                        <p class="text-[9px] uppercase tracking-widest text-slate-400 dark:text-slate-500 font-semibold px-1">
                            Temps pour craquer</p>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
                            <div class="flex items-center justify-between md:flex-col md:items-start p-2 rounded-xl bg-slate-50/50 dark:bg-white/5">
                                <span class="text-[9px] text-slate-400 dark:text-slate-500">Hash rapide</span>
                                <span id="token-crack-fast"
                                      class="text-[10px] font-mono font-bold text-slate-300 dark:text-slate-700 transition-colors duration-300">—</span>
                            </div>
                            <div class="flex items-center justify-between md:flex-col md:items-start p-2 rounded-xl bg-slate-50/50 dark:bg-white/5">
                                <span class="text-[9px] text-slate-400 dark:text-slate-500">Hash lent</span>
                                <span id="token-crack-slow"
                                      class="text-[10px] font-mono font-bold text-slate-300 dark:text-slate-700 transition-colors duration-300">—</span>
                            </div>
                            <div class="flex items-center justify-between md:flex-col md:items-start p-2 rounded-xl bg-slate-50/50 dark:bg-white/5">
                                <span class="text-[9px] text-slate-400 dark:text-slate-500">Quantique</span>
                                <span id="token-crack-quantum"
                                      class="text-[10px] font-mono font-bold text-slate-300 dark:text-slate-700 transition-colors duration-300">—</span>
                            </div>
                        </div>
                    </div>

                    <p id="token-status-msg" class="text-center text-[10px] font-bold min-h-[1rem]"></p>
                </div>
            </section>
        </div>
    </div>

</main>
</body>
</html>
